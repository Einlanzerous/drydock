<!-- The tab mark (DRY-86). Deliberately NOT the topbar logo scaled down.

     That logo is drawn in a 48-unit box, so at 16px its 1-unit dock strokes
     land on a third of a device pixel and antialias away to nothing. What
     survived was the hull fill alone — the mark lost the dock it is named
     after and read as a rowboat.

     So this is a separate drawing at the size it is used: a 16-unit box, every
     edge on a whole-pixel boundary, and nothing thinner than one unit — which
     is one device pixel, drawn crisp rather than averaged into the background.
     The mast is the same 1px hairline that failed above; it works here only
     because the box is 16 and not 48.

     Check any change at 16px against a real tab strip, ACTIVE AND INACTIVE —
     browsers dim an inactive tab, and that is where a hairline dies. None of
     this is visible at 48px, which is how it shipped.

     No plate. Browsers already round and pad tab icons, so it bought nothing
     but a third of the canvas, and being a fixed #0e1116 square it showed as a
     dark chip on a light tab strip. The scheme swap below does its job. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <style>
    .dock { fill: #5b7794 }
    .ship { fill: #8fb8dd }
    /* A favicon gets no page CSS, so the light variant has to ride inside the
       file. A browser that ignores this falls back to the dark-scheme colours,
       which are the readable default rather than a broken state. */
    @media (prefers-color-scheme: light) {
      .dock { fill: #2f4152 }
      .ship { fill: #3d6e97 }
    }
  </style>
  <!-- The graving dock: two walls and a floor. Kept a step dimmer than the
       hull so the two read apart at 16px instead of merging into one blob. -->
  <path class="dock" d="M0 4h2v8h12V4h2v10H0Z" />
  <!-- Hull, wide and flat. The width is what reads as a ship at this size; an
       earlier draft was taller and squarer and came out as a bathtub. -->
  <path class="ship" d="M3 8h10l-1 4H4Z" />
  <path class="ship" d="M6 6h3v2H6Z" />
  <path class="ship" d="M7 3h1v3H7Z" />
</svg>
