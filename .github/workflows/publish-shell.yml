# Build & push the shell image to GHCR (DRY-19).
#
# THREE ENTRYPOINTS, and only two of them publish semver tags:
#
#   push to main      :latest and :<full sha>. No semver — main is not a release.
#   workflow_call     the semver tags, called by release-please.yml in the same
#                     run that cut the release (SERV-125). The real release path.
#   workflow_dispatch re-publish by hand. Run it against a tag ref and the version
#                     is read from that ref, which is how a release cut before
#                     this file was fixed gets back-published.
#
# WHY THE RELEASE PATH IS A CALL AND NOT `on: push: tags` (SERV-125). Until this
# change no versioned image had ever been published here, so construct-server had
# to pin drydock by sha in versions.env — no patch float on a pull, and a rollback
# history that reads as a list of hashes. Adding a tag trigger would NOT have
# fixed it: release-please cuts the tag using GITHUB_TOKEN, and GitHub
# deliberately creates no workflow runs from events that token authored. argosy
# had exactly that trigger, with a comment claiming it published the semver tags,
# and it had never fired once. Being called from the push-to-main run that cut the
# tag depends on no event arriving at all.
name: publish-shell

on:
  push:
    branches: [main]
    paths:
      - "shell/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/publish-shell.yml"
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.7.0)"
        required: true
        type: string
      from_release:
        description: "Set by release-please.yml. Makes an empty tag a hard failure rather than a silent no-semver build."
        required: false
        default: false
        type: boolean
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/einlanzerous/drydock/shell
    steps:
      - name: Resolve the release version
        # Empty on an ordinary main push, and that emptiness is what selects the
        # :latest + :<sha> tag set below instead of the semver one.
        #
        # `github.ref_type` covers the dispatch case, so a hand-run against a tag
        # ref needs no second input that could disagree with the ref being built.
        #
        # Inputs reach the shell through env rather than being interpolated into
        # the script body — a `run:` block that pastes ${{ }} inline executes
        # whatever it contains.
        env:
          FROM_RELEASE: ${{ inputs.from_release }}
          CALLED_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          # A tag that reads back empty must be an ERROR here, not a fallback.
          # Without this, a broken `tag_name` output would land in the `else`
          # branch above, publish :latest and sha-<short>, and go green having
          # published no semver tag at all — which is precisely the silent
          # failure this workflow was fixed for, rebuilt out of new parts.
          # argosy has already been bitten by the sibling case once, reading
          # `.--tag_name` on a root component and getting an empty string.
          if [ "${FROM_RELEASE:-false}" = "true" ] && [ -z "${CALLED_TAG:-}" ]; then
            echo "Error: called from the release run, but the tag is empty."
            echo "release-please's tag_name output read back empty. Refusing to"
            echo "publish an unversioned image from a release run."
            exit 1
          fi

          if [ -n "${CALLED_TAG:-}" ]; then
            version="${CALLED_TAG#v}"
            source="workflow_call (tag $CALLED_TAG)"
          elif [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
            source="dispatched at tag $REF_NAME"
          else
            version=""
            source="branch build — no semver tags"
          fi

          # Refuse a version this script cannot split into major.minor rather than
          # publishing a tag built from a partial parse. A release build that goes
          # green having published no usable semver tag is the exact failure this
          # workflow is being fixed for.
          if [ -n "$version" ] && ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "Error: '$version' is not a semver, so no semver image tag would be published."
            echo "Dispatch this workflow against a v* tag ref, or call it with a v* tag."
            exit 1
          fi

          echo "SEMVER=$version" >> "$GITHUB_ENV"
          echo "Version source: $source"

      - name: Assemble tags and labels
        # Hand-built rather than via docker/metadata-action, deliberately. The
        # existing tags are :latest and the FULL 40-char commit sha with no
        # prefix, and construct-server's versions.env calls out that form
        # explicitly — argosy publishes `sha-<short>`, drydock the bare full sha —
        # with the warning not to "tidy" one into the other, because a normalised
        # tag that does not exist resolves to nothing and fails the deploy.
        # metadata-action's type=sha emits `sha-<...>`, so adopting it here would
        # silently invalidate the live DRYDOCK_TAG pin.
        #
        # The two tag sets are mutually exclusive: a RELEASE build publishes the
        # semver tags and nothing else, a main push publishes :latest and :<sha>
        # and nothing else. Both fire on a release — the release-please merge
        # commit touches package.json, which is in the paths filter above, so the
        # push run and the called run build the same commit seconds apart.
        # Splitting the sets means they never race to write the same tag, and
        # which build finished first does not decide what :latest points at.
        run: |
          set -euo pipefail
          {
            echo 'TAGS<<__EOT__'
            if [ -n "$SEMVER" ]; then
              echo "${IMAGE}:${SEMVER}"
              echo "${IMAGE}:${SEMVER%.*}"
            else
              echo "${IMAGE}:latest"
              echo "${IMAGE}:${GITHUB_SHA}"
            fi
            echo '__EOT__'
          } >> "$GITHUB_ENV"

          # OCI provenance (DRY-91). Switchyard's delivery matrix identifies a
          # service either by asking it over HTTP or by inspecting its container's
          # labels, and the daemon's HTTP surface isn't in this image — so for
          # drydock-shell these labels are not one route among several, they are
          # the only one. Without them it is the single first-party image that
          # cannot appear in the matrix truthfully.
          #
          # `revision` is the load-bearing half, because digests lie and revisions
          # don't (SERV-88). Two builds of ONE commit routinely disagree on digest
          # here — a job re-run, a workflow_dispatch on a commit its own push
          # already built, or now a release, where the push run and the called run
          # build the same commit within seconds of each other. `nginx:1.27-alpine`
          # is a floating tag that moves underneath us and the cache state differs.
          # Comparing digests then invents drift that does not exist, while the
          # commit is what makes "is this the same code" answerable.
          #
          # `version` is set on a RELEASE build and ABSENT otherwise, and the
          # absence is still deliberate (SERV-125). Between releases there is no
          # semver to state: package.json carries the LAST released version at
          # every commit on main, so filling the field from it would have every
          # between-releases build claim to be a release it isn't. An absent
          # version reads as an honest `unknown` beside a real revision, which is
          # the trade the matrix wants; a confident wrong one is the failure mode
          # it exists to avoid. On a release the version is not guessed from the
          # file — it comes from the tag release-please just cut, which is the one
          # moment the two genuinely agree.
          #
          # Set through the action's `labels:` rather than ARG/LABEL in the
          # Dockerfile on purpose. These change every build, and an ARG that
          # changes every build invalidates every layer beneath it; labels are
          # image config, so they cost no cache wherever they sit. It also keeps a
          # plain local `docker build` honestly label-less instead of baking in a
          # default that would go stale and be believed.
          {
            echo 'LABELS<<__EOT__'
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.source=https://github.com/Einlanzerous/drydock"
            if [ -n "$SEMVER" ]; then
              echo "org.opencontainers.image.version=${SEMVER}"
            fi
            echo '__EOT__'
          } >> "$GITHUB_ENV"

      - name: Report what will be published
        run: |
          printf 'Tags:\n%s\n\nLabels:\n%s\n' "$TAGS" "$LABELS"

      - uses: actions/checkout@v4
        with:
          # Build the commit the revision label below claims (DRY-91). On a push
          # these already agree; on workflow_dispatch `github.sha` is the branch
          # tip resolved when the run was dispatched, so a push landing in between
          # would leave the image built from one commit and stamped with another.
          # A revision that can be wrong is worse than none — the whole point of
          # preferring it to a digest is that it doesn't lie.
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: shell/Dockerfile
          push: true
          tags: ${{ env.TAGS }}
          labels: ${{ env.LABELS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
