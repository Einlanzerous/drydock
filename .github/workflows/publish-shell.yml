# Build & push the shell image to GHCR on every main push that touches it
# (DRY-19). Mirrors the aperture/construct-server pattern: Watchtower on the
# prod host pulls :latest on its schedule.
name: publish-shell

on:
  push:
    branches: [main]
    paths:
      - "shell/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/publish-shell.yml"
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the commit the revision label below claims (DRY-91). On a
          # push these already agree; on workflow_dispatch `github.sha` is the
          # branch tip resolved when the run was dispatched, so a push landing
          # in between would leave the image built from one commit and stamped
          # with another. A revision that can be wrong is worse than none —
          # the whole point of preferring it to a digest is that it doesn't lie.
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: shell/Dockerfile
          push: true
          tags: |
            ghcr.io/einlanzerous/drydock/shell:latest
            ghcr.io/einlanzerous/drydock/shell:${{ github.sha }}
          # OCI provenance (DRY-91). Switchyard's delivery matrix identifies a
          # service either by asking it over HTTP or by inspecting its
          # container's labels, and the daemon's HTTP surface isn't in this
          # image — so for drydock-shell these labels are not one route among
          # several, they are the only one. Without them it is the single
          # first-party image that cannot appear in the matrix truthfully.
          #
          # `revision` is the load-bearing half, because digests lie and
          # revisions don't (SERV-88). Two builds of ONE commit routinely
          # disagree on digest here — a job re-run, or a workflow_dispatch on a
          # commit its own push already built — since `nginx:1.27-alpine` is a
          # floating tag that moves underneath us and the cache state differs.
          # Comparing digests then invents drift that does not exist, while the
          # commit is what makes "is this the same code" answerable.
          #
          # The estate rule's own worked example — one commit built twice, once
          # on the push to main and once on the release tag — has NO counterpart
          # here: the only triggers are the push and a bare workflow_dispatch,
          # and the release-please merge is a DIFFERENT commit whose version
          # bump changes a copied layer anyway. The conclusion carries over; the
          # example does not.
          #
          # `version` is deliberately ABSENT, not forgotten. Nothing here has a
          # semver to state: the images are tagged :latest and :<sha> and pinned
          # by sha in construct-server's compose (DRYDOCK_TAG), and package.json
          # carries the LAST released version at every commit on main — so
          # filling the field from it would have every between-releases build
          # claim to be a release it isn't. An absent version reads as an honest
          # `unknown` beside a real revision, which is the trade the matrix
          # wants; a confident wrong one is the failure mode it exists to avoid.
          #
          # Set through the action's `labels:` rather than ARG/LABEL in the
          # Dockerfile on purpose. These change every build, and an ARG that
          # changes every build invalidates every layer beneath it; labels are
          # image config, so they cost no cache wherever they sit. It also keeps
          # a plain local `docker build` honestly label-less instead of baking
          # in a default that would go stale and be believed.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/Einlanzerous/drydock
          cache-from: type=gha
          cache-to: type=gha,mode=max
