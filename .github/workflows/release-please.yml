# Automated releases (DRY-38): release-please maintains a rolling release PR
# from Conventional Commits on main; merging it bumps package.json + CHANGELOG
# and tags a GitHub release. Commits that don't follow Conventional Commits
# (the old "DRY-NN: ..." style) are ignored for version math — see CLAUDE.md
# conventions.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # `.` is a ROOT component, and for a root path release-please v4 exposes the
      # outputs UN-prefixed (`releases_created`, `tag_name`). The `<path>--` prefix
      # applies only to non-root monorepo paths, so `.--tag_name` reads back empty
      # here — argosy hit exactly that and shipped a build against the branch name.
      releases_created: ${{ steps.rp.outputs.releases_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publish the versioned image in the same run that cut the tag (SERV-125).
  # publish-shell.yml runs on its own for :latest and :<sha> on every main push,
  # but its semver tags need a release. It cannot wait for a tag event to supply
  # one: release-please cuts the tag using GITHUB_TOKEN, and GitHub deliberately
  # creates no workflow runs from events that token authored — so an `on: push:
  # tags` trigger here would look right and never fire. Until this landed, no
  # versioned drydock image had ever been published, and construct-server had to
  # pin this service by sha rather than by major.minor.
  publish-shell:
    needs: release-please
    # `!= 'false'` rather than `== 'true'`, deliberately. release-please answers
    # exactly one of those two on a healthy run, so the third case — an output
    # that reads back EMPTY because it was renamed or wrongly prefixed — is a
    # real possibility, and under `== 'true'` it skips this job on every push
    # without a word. That is the same silent-skip shape as the bug being fixed.
    # This way a broken output runs the job and fails it loudly instead.
    if: needs.release-please.outputs.releases_created != 'false'
    uses: ./.github/workflows/publish-shell.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      from_release: true
    permissions:
      contents: read
      packages: write
